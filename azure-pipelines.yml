trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self
    displayName: 'Checkout files from GitHub'

  - script: |
      echo "✅ Files pulled from GitHub!"
      ls -la
    displayName: 'Show files from GitHub'

  - script: |
      git config --global user.email "pipeline@company.com"
      git config --global user.name "Azure Pipeline"

      # Clone the Azure DevOps repo
      git clone https://$(ADO_PAT)@dev.azure.com/ACN-CCoE/Enerwave%20-%20Digital%20Services/_git/GitHubToADOSync.git ado-repo

      # Copy all files from GitHub to ADO repo
      cp -r $(System.DefaultWorkingDirectory)/. ado-repo/ --exclude='.git'

      # Push to Azure DevOps
      cd ado-repo
      git add .
      git diff --cached --quiet || git commit -m "Sync from GitHub - $(Build.BuildNumber)"
      git push
    displayName: 'Mirror files to Azure DevOps Repo'
 
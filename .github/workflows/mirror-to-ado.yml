name: Mirror to Azure DevOps

on:
  push:
    branches:
      - main
      - development
      - staging
      - production

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push mirror to Azure DevOps
        run: |
          git config user.email "mirror-bot@github.com"
          git config user.name "Mirror Bot"
          git remote add ado https://anything:${{ secrets.ADO_PAT }}@dev.azure.com/ACN-CCoE/Enerwave%20-%20Digital%20Services/_git/GitHubToADOSync
          git push ado HEAD:${{ github.ref_name }} --force

      - name: Confirm mirror success
        run: echo "✅ Mirrored branch ${{ github.ref_name }} to Azure DevOps"
